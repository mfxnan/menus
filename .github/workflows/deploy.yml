name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate required variables
        run: |
          missing=()
          if [ -z "$SUPABASE_URL" ]; then
            missing+=("SUPABASE_URL")
          fi
          if [ -z "$SUPABASE_KEY" ]; then
            missing+=("SUPABASE_PUBLISHABLE_KEY (or SUPABASE_ANON_KEY)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Required repository variable(s) not set: ${missing[*]}"
            echo ""
            echo "Go to: Settings > Secrets and variables > Actions > Variables"
            echo "  Add SUPABASE_URL       = your Supabase project URL"
            echo "  Add SUPABASE_PUBLISHABLE_KEY = your Supabase publishable/anon key"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY }}
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY }}
          VITE_PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
